# Serialized lists, loaded when jms/serializer is installed
services:
  _defaults:
    autowire: true
    autoconfigure: true

  Padam87\AdminBundle\Listing\ValueNormalizer:
    arguments:
      $contextFactory: '@jms_serializer.serialization_context_factory'
      $handlerRegistry: '@jms_serializer.handler_registry'

  Padam87\AdminBundle\Listing\ListBuilder:
    arguments:
      $contextFactory: '@jms_serializer.serialization_context_factory'
      $processor: '@knp_paginator.helper.processor'
      $customizer: '@?Padam87\AdminBundle\Listing\ListCustomizerInterface'

  Padam87\AdminBundle\Serializer\ListSerializer:
    arguments:
      $processor: '@knp_paginator.helper.processor'

  Padam87\AdminBundle\Serializer\FormViewHandler: ~

  Padam87\AdminBundle\Twig\ListExtension: ~

  Padam87\AdminBundle\Twig\ListRuntime: ~
